[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-load-balancer"
version = "0.0.0"
description = "Framework-decoupled MoE load balancer prototype APIs."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"moe_load_balancer.adapters.sglang" = ["csrc/*.cuh"]
"moe_load_balancer.policies.l2" = ["csrc/*.cuh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: framework-neutral core/contract tests",
    "integration: tests that touch adapter glue or external frameworks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
