name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          python -m pip install build pytest pytest-cov ruff black mypy
          python -m pip install -e . --no-deps

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src/moe_load_balancer

      - name: CPU tests
        run: python -m pytest -m "not integration"

      - name: README quick start
        run: python examples/quickstart.py

      - name: Build distributions
        run: python -m build

      - name: Verify wheel contents and import
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import moe_load_balancer; print(moe_load_balancer.MoELoadBalancer)"

  gpu-contract:
    name: GPU test contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GPU integration tests remain separately marked
        run: |
          grep -R "pytest.mark.integration" tests/test_*cuda*.py
          grep -R "requires a CUDA device" tests/test_*cuda*.py
